<script>
  const app = document.getElementById('app');
  const API_URL = window.location.origin; // Dynamically targets your server URL

  // Check login by fetching profile from the backend session/email
  async function checkLogin() {
    const savedEmail = localStorage.getItem('userEmail');
    if (savedEmail) {
      try {
        const response = await fetch(`${API_URL}/api/profile/${savedEmail}`);
        if (response.ok) {
          const user = await response.json();
          showProfile(user);
          return;
        }
      } catch (err) {
        console.error("Backend error, falling back to form:", err);
      }
    }
    showLoginForm();
  }

  function showLoginForm(existingUser = {}) {
    const defaultPic = "https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=300&h=300&fit=crop&crop=face";

    app.innerHTML = `
      <h1>${existingUser.name ? 'Edit Profile' : 'Create Your Profile'}</h1>
      <div>
        <img src="${existingUser.picture || defaultPic}" alt="Profile" id="preview">
      </div>
      <input type="file" id="picture" accept="image/*">
      <input type="text" id="name" placeholder="Name" value="${existingUser.name || ''}" required>
      <input type="email" id="email" placeholder="Email" value="${existingUser.email || ''}" required ${existingUser.email ? 'disabled' : ''}>
      <textarea id="interests" placeholder="Interests" rows="3">${existingUser.interests || ''}</textarea>
      <button onclick="saveProfile('${existingUser.email ? 'update' : 'create'}')">${existingUser.name ? 'Update Profile' : 'Save & Continue'}</button>
    `;

    document.getElementById('picture').addEventListener('change', function(e) {
      if (e.target.files[0]) {
        const reader = new FileReader();
        reader.onload = function(ev) {
          document.getElementById('preview').src = ev.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
      }
    });
  }

  async function saveProfile(action) {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const interests = document.getElementById('interests').value.trim();
    const pictureInput = document.getElementById('picture');
    const previewSrc = document.getElementById('preview').src;

    if (!name || !email) {
      alert('Name and email are required!');
      return;
    }

    // Prepare Multipart Form Data to handle both text fields and files cleanly
    const formData = new FormData();
    formData.append('name', name);
    formData.append('email', email);
    formData.append('interests', interests);
    
    if (pictureInput.files[0]) {
      formData.append('picture', pictureInput.files[0]);
    } else {
      formData.append('picture_url', previewSrc);
    }

    try {
      const response = await fetch(`${API_URL}/api/profile`, {
        method: 'POST',
        body: formData
      });

      if (response.ok) {
        const result = await response.json();
        localStorage.setItem('userEmail', email);
        showProfile(result.user);
      } else {
        const errData = await response.json();
        alert('Error: ' + errData.message);
      }
    } catch (err) {
      alert('Failed to connect to backend.');
    }
  }

  function showProfile(user) {
    const defaultDog = "https://images.unsplash.com/photo-1583337130417-3346a1be7dee?w=300&h=300&fit=crop&crop=face";
    // If the image path is a local route, prepend your domain rule
    const imgSrc = user.picture && !user.picture.startsWith('http') ? `${API_URL}${user.picture}` : (user.picture || defaultDog);

    app.innerHTML = `
      <h1>User profile</h1>
      <img src="${imgSrc}" alt="Profile picture">
      <div class="profile-info">
        <p><strong>Name:</strong> ${user.name || 'Not set'}</p>
        <hr>
        <p><strong>Email:</strong> ${user.email || 'Not set'}</p>
        <hr>
        <p><strong>Interests:</strong> ${user.interests || 'None added yet'}</p>
      </div>
      <button onclick="showLoginForm(window.currentUser)">Edit Profile</button>
      <button style="margin-top:10px; background:#dc3545;" onclick="logout()">Logout</button>
    `;

    window.currentUser = user;
  }

  function logout() {
    localStorage.removeItem('userEmail');
    showLoginForm();
  }

  checkLogin();
</script>
